name: Reparar apertura sobre

on:
  pull_request_target:
    types: [opened, synchronize]
    branches: [main]

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Reparar CSS de apertura
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path("index.html")
          s = p.read_text(encoding="utf-8")

          css = r'''
<style id="wedding-invitation-opening-css">
#weddingInvitationOpen{position:fixed;inset:0;z-index:99999;background:#efe8da;overflow:hidden;opacity:1;visibility:visible;transition:opacity .7s ease,visibility .7s ease}
#weddingInvitationOpen.wio-opening{opacity:0;visibility:hidden;pointer-events:none}
#weddingInvitationOpen .wio-base{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:center;display:block}
#weddingInvitationOpen .wio-interior{position:absolute;left:0;top:0;width:100%;height:100%;background:radial-gradient(ellipse at 50% 43%,rgba(255,251,235,.98) 0%,rgba(247,237,210,.98) 35%,rgba(213,194,158,.95) 100%);clip-path:polygon(7% 49%,93% 49%,93% 94%,7% 94%);opacity:0;transform:translateY(18px);transition:opacity .55s ease,transform .7s cubic-bezier(.2,.8,.2,1)}
#weddingInvitationOpen.wio-open .wio-interior{opacity:1;transform:translateY(-2px)}
#weddingInvitationOpen .wio-flap-group{position:absolute;inset:0;transform-origin:50% 49%;transform-style:preserve-3d;transition:transform 1.05s cubic-bezier(.22,.75,.2,1)}
#weddingInvitationOpen.wio-open .wio-flap-group{transform:rotateX(-158deg)}
#weddingInvitationOpen .wio-flap{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:center;display:block;clip-path:polygon(0 0,100% 0,50% 52%,0 52%)}
#weddingInvitationOpen .wio-seal{position:absolute;left:50%;top:48%;width:min(18vw,105px);height:min(18vw,105px);transform:translate(-50%,-50%);border-radius:50%;overflow:hidden;box-shadow:0 4px 18px rgba(80,55,30,.24);transition:opacity .25s ease}
#weddingInvitationOpen.wio-open .wio-seal{opacity:0}
#weddingInvitationOpen .wio-seal img{width:100%;height:100%;object-fit:cover;object-position:center}
#weddingInvitationOpen .wio-hit{position:absolute;left:50%;top:48%;width:min(24vw,135px);height:min(24vw,135px);transform:translate(-50%,-50%);border:0;background:transparent;padding:0;cursor:pointer;z-index:10;-webkit-tap-highlight-color:transparent}
#weddingInvitationOpen .wio-hit:focus{outline:none}
#weddingInvitationOpen .wio-light{position:absolute;inset:0;background:radial-gradient(circle at 50% 58%,rgba(255,251,231,0) 0%,rgba(255,248,221,0) 25%,rgba(255,245,208,.75) 62%,rgba(255,255,255,.98) 100%);opacity:0;pointer-events:none}
#weddingInvitationOpen.wio-open .wio-light{animation:wioLight .9s ease 1.05s forwards}
#weddingInvitationOpen.wio-open .wio-base{animation:wioZoom 1.9s ease forwards}
@keyframes wioLight{0%{opacity:0;transform:scale(.75)}45%{opacity:1;transform:scale(1.02)}100%{opacity:0;transform:scale(1.15)}}
@keyframes wioZoom{0%{transform:scale(1)}100%{transform:scale(1.055)}}
@media (max-width:700px){#weddingInvitationOpen .wio-flap{clip-path:polygon(0 0,100% 0,50% 52%,0 52%)}#weddingInvitationOpen .wio-interior{clip-path:polygon(4% 49%,96% 49%,96% 95%,4% 95%)}}
</style>
'''
          if 'id="wedding-invitation-opening-css"' not in s:
              s = s.replace("</head>", css + "\n</head>", 1)

          p.write_text(s, encoding="utf-8")
          PY

      - name: Commitir y limpiar
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Restaura estilos de apertura del sobre" || true
          git push
          rm -f .github/workflows/reparar-apertura.yml
          git add .github/workflows/reparar-apertura.yml
          git commit -m "Limpia workflow auxiliar" || true
          git push
