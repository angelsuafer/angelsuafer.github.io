name: Dejar apertura limpia

on:
  push:
    paths:
      - '.github/workflows/dejar-apertura-limpia.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Restaurar versión limpia y añadir solo zona táctil invisible
        run: |
          set -e
          BASE="8be4f486d84d140ff0b55977434a3eadea319755"
          git show "$BASE:index.html" > index.html
          IMG=$(find . -maxdepth 1 -type f -iname 'invit*.png' -printf '%f\n' | head -n 1)
          test -n "$IMG"
          python3 - "$IMG" <<'PY'
          from pathlib import Path
          import sys
          p=Path("index.html")
          s=p.read_text(encoding="utf-8")
          img=sys.argv[1]

          css = """
          <style id="wedding-invitation-open-style">
          #weddingInvitationOpen{
            position:fixed!important;inset:0!important;z-index:2147483647!important;
            display:block!important;background:#eee9df!important;
            overflow:hidden!important;opacity:1;visibility:visible;
            transition:opacity 1.1s ease,visibility 1.1s ease;
          }
          #weddingInvitationOpen.wio-hidden{
            opacity:0!important;visibility:hidden!important;pointer-events:none!important;
          }
          #weddingInvitationOpen .wio-image{
            position:absolute!important;inset:0!important;width:100%!important;height:100%!important;
            display:block!important;margin:0!important;padding:0!important;
            object-fit:cover!important;object-position:center!important;
            border:0!important;border-radius:0!important;
            transform:scale(1);transition:transform 1.5s ease,opacity 1.1s ease;
          }
          #weddingInvitationOpen.wio-opening .wio-image{
            transform:scale(1.045)!important;
          }
          #weddingInvitationOpen .wio-hit{
            position:absolute!important;
            left:50%!important;top:52%!important;
            width:180px!important;height:180px!important;
            min-width:0!important;min-height:0!important;
            margin:0!important;padding:0!important;
            transform:translate(-50%,-50%)!important;
            display:block!important;
            opacity:0!important;
            visibility:visible!important;
            background:transparent!important;
            background-color:transparent!important;
            border:0!important;border-radius:50%!important;
            box-shadow:none!important;
            outline:0!important;
            color:transparent!important;
            font-size:0!important;
            appearance:none!important;-webkit-appearance:none!important;
            cursor:pointer!important;
            z-index:10!important;
          }
          #weddingInvitationOpen .wio-hit:focus,
          #weddingInvitationOpen .wio-hit:hover,
          #weddingInvitationOpen .wio-hit:active{
            opacity:0!important;background:transparent!important;box-shadow:none!important;outline:0!important;
          }
          @media(max-width:600px){
            #weddingInvitationOpen .wio-hit{
              width:155px!important;height:155px!important;
              top:52%!important;
            }
          }
          </style>
          """

          html = f"""
          <div id="weddingInvitationOpen" aria-label="Abrir invitación">
            <img class="wio-image" src="{img}" alt="Invitación de Ángel y Antonio">
            <button class="wio-hit" id="weddingInvitationHit" type="button" aria-label="Abrir invitación"></button>
          </div>
          """

          js = """
          <script id="wedding-invitation-open-script">
          (function(){
            var layer=document.getElementById('weddingInvitationOpen');
            var hit=document.getElementById('weddingInvitationHit');
            if(!layer||!hit)return;
            var done=false;
            function openIt(){
              if(done)return;
              done=true;
              hit.blur();
              layer.classList.add('wio-opening');
              setTimeout(function(){
                layer.classList.add('wio-hidden');
                setTimeout(function(){layer.remove();},1150);
              },420);
            }
            hit.addEventListener('click',openIt);
          })();
          </script>
          """

          s=s.replace("</body>",css+html+js+"\n</body>",1)
          p.write_text(s,encoding="utf-8")
          PY

          rm -f .github/workflows/dejar-apertura-limpia.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git add -A
          git commit -m "Elimina superposiciones de la apertura" || exit 0
          git push
