name: Refinar apertura cinematográfica

on:
  push:
    paths:
      - '.github/workflows/refinar-sobre.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refine:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Refinar animación sin tocar el resto de la web
        run: |
          set -e
          python3 <<'PY'
          from pathlib import Path
          import re

          p = Path("index.html")
          s = p.read_text(encoding="utf-8")

          start = s.index('<style id="wedding-invitation-animation-style">')
          end = s.index('</style>', start) + len('</style>')

          css = r'''<style id="wedding-invitation-animation-style">
          #weddingInvitationOpen{
            position:fixed!important;inset:0!important;z-index:2147483647!important;
            display:block!important;background:#eee9df!important;overflow:hidden!important;
            opacity:1;visibility:visible;transition:opacity .75s ease,visibility .75s ease;
            perspective:1200px;
          }
          #weddingInvitationOpen.wio-finished{
            opacity:0!important;visibility:hidden!important;pointer-events:none!important;
          }
          #weddingInvitationOpen .wio-base,
          #weddingInvitationOpen .wio-flap{
            position:absolute!important;inset:0!important;width:100%!important;height:100%!important;
            display:block!important;margin:0!important;padding:0!important;
            object-fit:cover!important;object-position:center!important;
            border:0!important;border-radius:0!important;
          }
          #weddingInvitationOpen .wio-base{
            z-index:1;transform:scale(1);
            transition:transform 1.45s cubic-bezier(.18,.72,.2,1),filter 1.1s ease;
          }
          #weddingInvitationOpen .wio-flap{
            z-index:5;
            clip-path:polygon(0 0,100% 0,100% 63.5%,50% 78%,0 63.5%);
            transform-origin:50% 63.5%;
            backface-visibility:hidden;-webkit-backface-visibility:hidden;
            transition:transform .78s cubic-bezier(.35,.05,.25,1),filter .78s ease;
          }
          #weddingInvitationOpen .wio-seal{
            position:absolute!important;z-index:10;left:50%!important;top:52%!important;
            width:155px!important;height:155px!important;transform:translate(-50%,-50%)!important;
            margin:0!important;padding:0!important;border:0!important;border-radius:50%!important;
            background:transparent!important;opacity:0!important;cursor:pointer!important;
            appearance:none!important;-webkit-appearance:none!important;
          }
          #weddingInvitationOpen .wio-seal:focus,
          #weddingInvitationOpen .wio-seal:hover,
          #weddingInvitationOpen .wio-seal:active{
            outline:0!important;box-shadow:none!important;background:transparent!important;opacity:0!important;
          }
          #weddingInvitationOpen .wio-card{
            position:absolute!important;z-index:3;left:50%;top:48%;
            width:min(72vw,360px);height:min(42vh,270px);
            transform:translate(-50%,38%) scale(.94);
            background:linear-gradient(145deg,#fffdf8 0%,#f6f0e3 68%,#e9dfcb 100%);
            border:1px solid rgba(139,128,98,.28);
            box-shadow:0 22px 55px rgba(61,48,28,.25);
            opacity:0;border-radius:2px;
            transition:transform .82s cubic-bezier(.18,.78,.2,1),opacity .28s ease;
          }
          #weddingInvitationOpen .wio-card:before{
            content:"";position:absolute;inset:14px;
            border:1px solid rgba(139,128,98,.22);
          }
          #weddingInvitationOpen .wio-light{
            position:absolute;inset:-30%;z-index:20;pointer-events:none;
            opacity:0;
            background:radial-gradient(circle at 50% 53%,
              rgba(255,255,255,1) 0%,
              rgba(255,250,232,.96) 10%,
              rgba(255,255,255,.62) 27%,
              rgba(255,255,255,0) 62%);
            transform:scale(.25);
          }
          #weddingInvitationOpen.wio-opening .wio-flap{
            transform:perspective(1100px) rotateX(-78deg);
            filter:brightness(1.08);
          }
          #weddingInvitationOpen.wio-opening .wio-card{
            opacity:1;transform:translate(-50%,-10%) scale(1);
            transition-delay:.12s;
          }
          #weddingInvitationOpen.wio-opening .wio-light{
            animation:wioLight .9s ease-out .62s forwards;
          }
          #weddingInvitationOpen.wio-opening .wio-base{
            transform:scale(1.065);
            filter:brightness(1.03);
          }
          @keyframes wioLight{
            0%{opacity:0;transform:scale(.25)}
            42%{opacity:.98;transform:scale(.78)}
            100%{opacity:1;transform:scale(1.6)}
          }
          @media(max-width:600px){
            #weddingInvitationOpen .wio-seal{width:155px!important;height:155px!important;top:52%!important}
            #weddingInvitationOpen .wio-card{width:76vw;height:35vh;top:49%}
          }
          </style>'''

          s = s[:start] + css + s[end:]

          s = s.replace(
            'setTimeout(function(){\n      layer.classList.add(\'wio-finished\');\n      setTimeout(function(){layer.remove();},950);\n    },1450);',
            'setTimeout(function(){\n      layer.classList.add(\'wio-finished\');\n      setTimeout(function(){layer.remove();},800);\n    },1550);'
          )

          p.write_text(s, encoding="utf-8")
          PY

          rm -f .github/workflows/refinar-sobre.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git add -A
          git commit -m "Refina apertura cinematográfica del sobre" || exit 0
          git push
