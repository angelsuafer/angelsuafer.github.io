name: Refinar apertura natural

on:
  pull_request_target:
    types: [opened, reopened]
    branches: [main]

permissions:
  contents: write
  pull-requests: write

jobs:
  apply:
    if: startsWith(github.head_ref, 'refinar-apertura-')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1
      - name: Sustituir apertura
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -e
          python3 <<'PY'
          from pathlib import Path
          import re
          p=Path("index.html")
          s=p.read_text(encoding="utf-8")
          css=r'''<style id="wedding-invitation-animation-style">
          #weddingInvitationOpen{position:fixed!important;inset:0!important;z-index:2147483647!important;display:block!important;overflow:hidden!important;background:#eee9df!important;opacity:1;visibility:visible;perspective:1800px;transition:opacity .72s ease,visibility .72s ease}
          #weddingInvitationOpen.wio-finished{opacity:0!important;visibility:hidden!important;pointer-events:none!important}
          #weddingInvitationOpen .wio-base{position:absolute!important;inset:0!important;width:100%!important;height:100%!important;object-fit:cover!important;object-position:center!important;display:block!important;margin:0!important;padding:0!important;border:0!important;transform:none!important;filter:none!important}
          #weddingInvitationOpen .wio-interior{position:absolute!important;inset:0!important;z-index:3;pointer-events:none;opacity:0;clip-path:polygon(6.8% 31%,93.2% 31%,50% 48.2%);background:radial-gradient(ellipse at 50% 43%,rgba(255,249,232,.98) 0%,rgba(239,224,198,.98) 55%,rgba(193,166,125,.42) 100%),linear-gradient(180deg,#f8efdf,#e7d5b7);box-shadow:inset 0 12px 22px rgba(74,52,26,.16),inset 0 -18px 26px rgba(74,52,26,.10);transition:opacity .16s ease .08s}
          #weddingInvitationOpen .wio-flap-group{position:absolute!important;inset:0!important;z-index:6;pointer-events:none;transform-origin:50% 31%!important;transform:perspective(1800px) rotateX(0deg);transform-style:preserve-3d;backface-visibility:hidden;-webkit-backface-visibility:hidden;transition:transform 1.02s cubic-bezier(.22,.72,.18,1)}
          #weddingInvitationOpen .wio-flap{position:absolute!important;inset:0!important;width:100%!important;height:100%!important;object-fit:cover!important;object-position:center!important;display:block!important;margin:0!important;padding:0!important;border:0!important;clip-path:polygon(0 31%,100% 31%,50% 46.8%);transform:none!important}
          #weddingInvitationOpen .wio-seal-img{position:absolute!important;left:50%!important;top:49.4%!important;width:min(22vw,190px)!important;height:min(22vw,190px)!important;transform:translate(-50%,-50%)!important;object-fit:cover!important;object-position:center!important;clip-path:circle(49% at 50% 50%);margin:0!important;padding:0!important;border:0!important;border-radius:50%!important;display:block!important}
          #weddingInvitationOpen .wio-hit{position:absolute!important;z-index:12;left:50%!important;top:49.4%!important;width:min(26vw,220px)!important;height:min(26vw,220px)!important;transform:translate(-50%,-50%)!important;margin:0!important;padding:0!important;border:0!important;border-radius:50%!important;background:transparent!important;opacity:0!important;cursor:pointer!important;appearance:none!important;-webkit-appearance:none!important}
          #weddingInvitationOpen .wio-hit:focus,#weddingInvitationOpen .wio-hit:hover,#weddingInvitationOpen .wio-hit:active{outline:0!important;box-shadow:none!important;background:transparent!important;opacity:0!important}
          #weddingInvitationOpen .wio-light{position:absolute;inset:-30%;z-index:20;pointer-events:none;opacity:0;transform:scale(.2);background:radial-gradient(circle at 50% 48%,rgba(255,255,255,1) 0%,rgba(255,249,226,.96) 10%,rgba(255,255,255,.68) 27%,rgba(255,255,255,.18) 48%,rgba(255,255,255,0) 70%)}
          #weddingInvitationOpen.wio-opening .wio-interior{opacity:1}
          #weddingInvitationOpen.wio-opening .wio-flap-group{transform:perspective(1800px) rotateX(-158deg)}
          #weddingInvitationOpen.wio-opening .wio-light{animation:wioLightNatural 1.05s ease-out .62s forwards}
          #weddingInvitationOpen.wio-opening .wio-base{animation:wioBasePush 1.9s cubic-bezier(.2,.8,.2,1) forwards}
          @keyframes wioBasePush{0%{transform:scale(1)}100%{transform:scale(1.035)}}
          @keyframes wioLightNatural{0%{opacity:0;transform:scale(.2)}30%{opacity:.35;transform:scale(.48)}58%{opacity:.9;transform:scale(.9)}78%{opacity:1;transform:scale(1.35)}100%{opacity:1;transform:scale(1.9)}}
          </style>'''
          if '<style id="wedding-invitation-animation-style">' not in s: raise SystemExit("No se encontró la apertura actual")
          s=re.sub(r'<style id="wedding-invitation-animation-style">[\s\S]*?</style>',css,s,count=1)
          html='''<div id="weddingInvitationOpen" aria-label="Abrir invitación">
            <img class="wio-base" src="invitación.PNG" alt="Invitación de Ángel y Antonio">
            <div class="wio-interior" aria-hidden="true"></div>
            <div class="wio-flap-group" aria-hidden="true">
              <img class="wio-flap" src="invitación.PNG" alt="">
              <img class="wio-seal-img" src="invitación.PNG" alt="">
            </div>
            <div class="wio-light" aria-hidden="true"></div>
            <button class="wio-hit" id="weddingInvitationHit" type="button" aria-label="Abrir invitación"></button>
          </div>'''
          start=s.find('<div id="weddingInvitationOpen"')
          if start<0: raise SystemExit("No se encontró el contenedor")
          pos=start; depth=0
          while True:
            o=s.find('<div',pos); c=s.find('</div>',pos)
            if c<0: raise SystemExit("No se pudo cerrar el contenedor")
            if o>=0 and o<c: depth+=1; pos=o+4
            else:
              depth-=1; pos=c+6
              if depth==0: end=pos; break
          s=s[:start]+html+s[end:]
          js='''<script>
          (function(){
            var layer=document.getElementById('weddingInvitationOpen');
            var hit=document.getElementById('weddingInvitationHit');
            if(!layer||!hit)return;
            var done=false;
            function openIt(){
              if(done)return;
              done=true;
              hit.blur();
              layer.classList.add('wio-opening');
              setTimeout(function(){
                layer.classList.add('wio-finished');
                setTimeout(function(){layer.remove();},760);
              },2050);
            }
            hit.addEventListener('click',openIt);
          })();
          </script>'''
          j=s.find("weddingInvitationHit",start)
          ss=s.rfind("<script",0,j); ee=s.find("</script>",j)
          if ss<0 or ee<0: raise SystemExit("No se encontró el script")
          s=s[:ss]+js+s[ee+9:]
          p.write_text(s,encoding="utf-8")
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Refina la apertura natural del sobre" || true
          git push origin main
          rm -f .github/workflows/refinar-apertura.yml
          git add -A
          git commit -m "Limpia el workflow auxiliar" || true
          git push origin main
          gh pr close "$PR_NUMBER" --delete-branch || true
