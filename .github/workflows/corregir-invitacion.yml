name: Corregir apertura de invitación

on:
  push:
    paths:
      - '.github/workflows/corregir-invitacion.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Restaurar la web limpia y añadir solo la nueva apertura
        run: |
          set -e
          BASE="8be4f486d84d140ff0b55977434a3eadea319755"
          git show "$BASE:index.html" > index.html

          IMG=$(find . -maxdepth 1 -type f \( -iname 'invit*.png' \) -printf '%f\n' | head -n 1)
          test -n "$IMG"

          python3 - "$IMG" <<'PY'
          from pathlib import Path
          import sys
          img=sys.argv[1]
          p=Path("index.html")
          s=p.read_text(encoding="utf-8")

          css=r"""
          <style id="cinematic-invitation-style">
          #cinematicInvitation{
            position:fixed;inset:0;z-index:2147483647;
            display:flex;align-items:center;justify-content:center;
            background:#eee9df;overflow:hidden;
            opacity:1;visibility:visible;
            transition:opacity 1.15s ease,visibility 1.15s ease;
          }
          #cinematicInvitation.hidden{opacity:0;visibility:hidden;pointer-events:none}
          #cinematicInvitation .cinematic-image{
            position:absolute;inset:0;width:100%;height:100%;
            object-fit:cover;object-position:center;
            transform:scale(1);
            transition:transform 1.65s cubic-bezier(.2,.75,.2,1),filter 1.15s ease,opacity 1.15s ease;
          }
          #cinematicInvitation.opening .cinematic-image{
            transform:scale(1.075) translateY(-1.5%);filter:brightness(1.04);
          }
          #cinematicInvitation .seal-hit{
            position:absolute;left:50%;top:57%;
            width:min(24vw,150px);height:min(24vw,150px);
            min-width:92px;min-height:92px;
            transform:translate(-50%,-50%);
            border:0;background:transparent;border-radius:50%;
            cursor:pointer;z-index:3;padding:0;
            -webkit-tap-highlight-color:transparent;
          }
          #cinematicInvitation .seal-hit:focus{outline:none}
          #cinematicInvitation .seal-glow{
            position:absolute;left:50%;top:57%;
            width:min(27vw,175px);height:min(27vw,175px);
            min-width:104px;min-height:104px;
            transform:translate(-50%,-50%);
            border-radius:50%;pointer-events:none;
            animation:sealPulse 2.4s ease-in-out infinite;z-index:2;
          }
          #cinematicInvitation .touch-hint{
            position:absolute;left:50%;top:72%;
            transform:translateX(-50%);z-index:4;
            text-align:center;color:#fff;
            text-shadow:0 2px 12px rgba(0,0,0,.45);
            font-family:Georgia,"Times New Roman",serif;
            letter-spacing:.24em;text-transform:uppercase;
            font-size:11px;white-space:nowrap;pointer-events:none;
            animation:hintFloat 2.8s ease-in-out infinite;
          }
          #cinematicInvitation .touch-hint span{display:block;font-size:9px;letter-spacing:.18em;margin-top:7px;opacity:.9}
          @keyframes sealPulse{0%,100%{box-shadow:0 0 0 0 rgba(255,255,255,0)}50%{box-shadow:0 0 0 12px rgba(255,255,255,.12)}}
          @keyframes hintFloat{0%,100%{opacity:.72;transform:translateX(-50%) translateY(0)}50%{opacity:1;transform:translateX(-50%) translateY(-4px)}}
          @media(max-width:600px){
            #cinematicInvitation .cinematic-image{object-position:center center}
            #cinematicInvitation .seal-hit{top:57%;width:30vw;height:30vw}
            #cinematicInvitation .seal-glow{top:57%;width:34vw;height:34vw}
            #cinematicInvitation .touch-hint{top:72%;font-size:10px}
          }
          </style>
          """

          html=f"""
          <div id="cinematicInvitation" aria-label="Abrir invitación">
            <img class="cinematic-image" src="{img}" alt="Invitación de Ángel y Antonio">
            <div class="seal-glow" aria-hidden="true"></div>
            <button class="seal-hit" id="cinematicSeal" type="button" aria-label="Abrir la invitación"></button>
            <div class="touch-hint">TOCA EL SELLO<span>PARA ABRIR NUESTRA INVITACIÓN</span></div>
          </div>
          """

          js=r"""
          <script id="cinematic-invitation-script">
          (function(){
            var intro=document.getElementById('cinematicInvitation');
            var seal=document.getElementById('cinematicSeal');
            if(!intro||!seal)return;
            var opened=false;
            function openInvitation(){
              if(opened)return;
              opened=true;
              seal.blur();
              intro.classList.add('opening');
              setTimeout(function(){
                intro.classList.add('hidden');
                setTimeout(function(){intro.remove();},1200);
              },520);
            }
            seal.addEventListener('click',openInvitation);
            intro.addEventListener('click',function(e){if(e.target===intro)openInvitation();});
          })();
          </script>
          """

          s=s.replace("</body>",css+html+js+"\n</body>",1)
          p.write_text(s,encoding="utf-8")
          PY

          rm -f .github/workflows/corregir-invitacion.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git add -A
          git commit -m "Corrige apertura y elimina intro anterior" || exit 0
          git push
