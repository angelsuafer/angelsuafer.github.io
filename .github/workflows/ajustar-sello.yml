name: Ajustar sello de invitación

on:
  push:
    paths:
      - '.github/workflows/ajustar-sello.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Quitar elementos superpuestos y hacer invisible el área táctil
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          p=Path("index.html")
          s=p.read_text(encoding="utf-8")

          # Eliminar la pista de texto y el halo superpuestos: ya están integrados en la imagen PNG.
          s=re.sub(r'\s*<div class="seal-glow"[^>]*></div>', '', s)
          s=re.sub(r'\s*<div class="touch-hint">.*?</div>', '', s, flags=re.S)

          # Convertir el botón en una zona táctil totalmente invisible y situarla sobre el sello real.
          s=s.replace(
            'width:min(24vw,150px);height:min(24vw,150px);',
            'width:150px!important;height:150px!important;'
          )
          s=s.replace(
            'min-width:92px;min-height:92px;',
            'min-width:0!important;min-height:0!important;'
          )
          s=s.replace(
            'transform:translate(-50%,-50%);\n            border:0;background:transparent;border-radius:50%;',
            'transform:translate(-50%,-50%);\n            border:0!important;background:transparent!important;border-radius:50%;box-shadow:none!important;outline:none!important;appearance:none;-webkit-appearance:none;'
          )
          s=s.replace('position:absolute;left:50%;top:57%;', 'position:absolute;left:50%;top:48%;', 1)
          # Remove CSS for deleted visual overlays.
          s=re.sub(r'\s*#cinematicInvitation \.seal-glow\{.*?\}', '', s, flags=re.S)
          s=re.sub(r'\s*#cinematicInvitation \.touch-hint\{.*?\}', '', s, flags=re.S)
          s=re.sub(r'\s*#cinematicInvitation \.touch-hint span\{.*?\}', '', s, flags=re.S)
          s=re.sub(r'\s*@keyframes sealPulse\{.*?\}', '', s, flags=re.S)
          s=re.sub(r'\s*@keyframes hintFloat\{.*?\}', '', s, flags=re.S)
          # Remove mobile overrides for deleted overlays / restore seal position.
          s=re.sub(r'\s*#cinematicInvitation \.seal-glow\{.*?\}', '', s, flags=re.S)
          s=re.sub(r'\s*#cinematicInvitation \.touch-hint\{.*?\}', '', s, flags=re.S)
          s=s.replace('#cinematicInvitation .seal-hit{top:57%;width:30vw;height:30vw}', '#cinematicInvitation .seal-hit{top:48%;width:150px!important;height:150px!important}')
          s=s.replace('#cinematicInvitation .seal-glow{top:57%;width:34vw;height:34vw}', '')
          s=s.replace('#cinematicInvitation .touch-hint{top:72%;font-size:10px}', '')
          p.write_text(s,encoding="utf-8")
          PY
          rm -f .github/workflows/ajustar-sello.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git add -A
          git commit -m "Corrige zona táctil del sello" || exit 0
          git push
