name: Refine wedding intro

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  refine:
    if: "!contains(github.event.head_commit.message, 'Refina intro [TEO]')"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Refine intro
        shell: python
        env:
          INTRO_B64: ""
        run: |
          from pathlib import Path
          import os
          p=Path("index.html")
          s=p.read_text(encoding="utf-8")
          css=r'''/* TEO — invitación cinematográfica */.wedding-intro{position:fixed;inset:0;z-index:99999;background:#e9dfcd;overflow:hidden;opacity:1;visibility:visible;transition:opacity 1s ease,visibility 1s ease}.wedding-intro.is-gone{opacity:0;visibility:hidden;pointer-events:none}.wedding-intro-scene{position:absolute;inset:0;overflow:hidden}.wedding-intro-image{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:center center;transform:scale(1);transition:transform 2.1s cubic-bezier(.2,.8,.2,1),filter 1.5s ease}.wedding-intro-vignette{position:absolute;inset:0;background:radial-gradient(circle at 50% 44%,transparent 42%,rgba(52,42,29,.08) 100%);pointer-events:none}.wedding-intro-film{position:absolute;inset:0;background:linear-gradient(180deg,rgba(255,249,237,.08),transparent 35%,transparent 70%,rgba(57,45,30,.08));pointer-events:none}.wedding-intro-seal-hit{position:absolute;left:50%;top:50.1%;width:clamp(58px,14vw,96px);height:clamp(58px,14vw,96px);transform:translate(-50%,-50%);border:0;border-radius:50%;background:transparent;cursor:pointer;z-index:5;box-shadow:0 0 0 1px rgba(180,145,89,.32),0 0 24px rgba(167,127,60,.18);transition:box-shadow .4s ease,transform .35s ease;touch-action:manipulation}.wedding-intro-seal-hit:after{content:"";position:absolute;inset:6px;border-radius:50%;border:1px solid rgba(255,248,232,.28)}.wedding-intro-flap{position:absolute;left:13%;right:13%;top:34.5%;height:28%;z-index:4;background:linear-gradient(180deg,rgba(255,253,247,.97),rgba(239,229,209,.96));clip-path:polygon(0 0,100% 0,50% 100%);transform-origin:50% 0;transform:rotateX(0deg);backface-visibility:hidden;opacity:0;filter:drop-shadow(0 12px 14px rgba(55,44,31,.16));transition:transform 1.15s cubic-bezier(.2,.8,.2,1),opacity .35s ease}.wedding-intro.opening .wedding-intro-image{transform:scale(1.055);filter:brightness(1.035) saturate(1.02)}.wedding-intro.opening .wedding-intro-flap{opacity:.82;transform:rotateX(-168deg)}.wedding-intro.opening .wedding-intro-seal-hit{opacity:0;transform:translate(-50%,-50%) scale(.7);box-shadow:none}.wedding-intro.opening .wedding-intro-film{animation:wedding-film-flash 1.5s ease both}@keyframes wedding-film-flash{0%{opacity:0}45%{opacity:.55}100%{opacity:0}}@media(max-width:700px){.wedding-intro-flap{left:10%;right:10%;top:34%;height:29%}}'''
          if "/* TEO — invitación cinematográfica */" in s:
              start=s.index("/* TEO — invitación cinematográfica */")
              end=s.index("</style>",start)
              s=s[:start]+css+s[end:]
          elif "/* TEO — invitación de entrada */" in s:
              start=s.index("/* TEO — invitación de entrada */")
              end=s.index("</style>",start)
              s=s[:start]+css+s[end:]
          else:
              end=s.index("</style>")
              s=s[:end]+css+s[end:]
          b64=os.environ["INTRO_B64"]
          html=f'''<div class="wedding-intro" id="weddingIntro" aria-hidden="false"><div class="wedding-intro-scene"><img class="wedding-intro-image" alt="" src="data:image/jpeg;base64,{b64}"><div class="wedding-intro-vignette"></div><div class="wedding-intro-film"></div><div class="wedding-intro-flap"></div><button class="wedding-intro-seal-hit" id="weddingIntroOpen" type="button" aria-label="Abrir la invitación"></button></div></div>'''
          import re
          s=re.sub(r'<div class="wedding-intro" id="weddingIntro"[sS]*?(?=<nav>)',html,s,count=1)
          s=re.sub(r'<script>.*?weddingIntro.*?</script>','',s,flags=re.S)
          p.write_text(s,encoding="utf-8")
      - name: Commit and clean
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git rm .github/workflows/refine-wedding-intro.yml
          git commit -m "Refina intro [TEO]"
          git push
