name: Aplicar sobre de invitacion
on:
  push:
    branches: [main]
    paths:
      - ".activar-sobre"
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Insertar sobre y apertura
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path("index.html")
          s=p.read_text(encoding="utf-8")
          if 'id="wedding-invitation-opening"' in s:
              print("Ya existe")
              raise SystemExit
          css='''<style id="wedding-invitation-opening-style">
html.wio-lock,html.wio-lock body{overflow:hidden!important}
#wedding-invitation-opening{position:fixed;inset:0;z-index:2147483647;background:#efe4cf;overflow:hidden;opacity:1;visibility:visible}
#wedding-invitation-opening.wio-done{opacity:0;visibility:hidden;pointer-events:none;transition:opacity .7s ease,visibility .7s ease}
#wedding-invitation-opening .wio-scene,#wedding-invitation-opening .wio-flap{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:center;display:block}
#wedding-invitation-opening .wio-scene{transform:scale(1);transition:transform 2.1s ease}
#wedding-invitation-opening.wio-open .wio-scene{transform:scale(1.035)}
#wedding-invitation-opening .wio-inside{position:absolute;left:7%;right:7%;top:30.5%;height:39%;background:radial-gradient(ellipse at 50% 42%,#fffdf4 0%,#f8efd9 48%,#e1cba5 100%);box-shadow:0 12px 45px rgba(80,54,25,.25);opacity:0;transform:translateY(7%);transition:opacity .5s ease,transform .85s cubic-bezier(.18,.78,.2,1)}
#wedding-invitation-opening.wio-open .wio-inside{opacity:1;transform:translateY(-2%)}
#wedding-invitation-opening .wio-flap-wrap{position:absolute;inset:0;transform-origin:50% 30.5%;transform-style:preserve-3d;transition:transform 1.15s cubic-bezier(.2,.78,.18,1)}
#wedding-invitation-opening.wio-open .wio-flap-wrap{transform:rotateX(-172deg)}
#wedding-invitation-opening .wio-flap{clip-path:polygon(7% 30.5%,93% 30.5%,50% 51%,7% 30.5%);backface-visibility:hidden}
#wedding-invitation-opening .wio-seal{position:absolute;left:50%;top:51%;width:min(23vw,105px);aspect-ratio:1;transform:translate(-50%,-50%);border-radius:50%;overflow:hidden;box-shadow:0 5px 22px rgba(62,42,19,.3)}
#wedding-invitation-opening .wio-seal img{width:100%;height:100%;object-fit:cover;object-position:50% 51%}
#wedding-invitation-opening .wio-hit{position:absolute;left:50%;top:51%;width:min(30vw,140px);aspect-ratio:1;transform:translate(-50%,-50%);border:0;background:transparent;padding:0;z-index:20;cursor:pointer;-webkit-tap-highlight-color:transparent}
#wedding-invitation-opening .wio-hit:focus{outline:none}
#wedding-invitation-opening .wio-light{position:absolute;inset:-20%;z-index:30;pointer-events:none;opacity:0;background:radial-gradient(circle at 50% 52%,rgba(255,252,233,0) 0 18%,rgba(255,248,221,.8) 45%,rgba(255,255,255,.98) 72%,#fff 100%);transform:scale(.65)}
#wedding-invitation-opening.wio-open .wio-light{animation:wio-flash .85s ease 1.05s forwards}
@keyframes wio-flash{0%{opacity:0;transform:scale(.65)}35%{opacity:1;transform:scale(.95)}100%{opacity:0;transform:scale(1.15)}}
</style>'''
          html='''<div id="wedding-invitation-opening" aria-label="Invitación de boda"><img class="wio-scene" src="invitaci%C3%B3n.PNG" alt="Invitación de Ángel y Antonio"><div class="wio-inside" aria-hidden="true"></div><div class="wio-flap-wrap" aria-hidden="true"><img class="wio-flap" src="invitaci%C3%B3n.PNG" alt=""><span class="wio-seal"><img src="invitaci%C3%B3n.PNG" alt=""></span></div><button class="wio-hit" type="button" aria-label="Abrir invitación"></button><div class="wio-light"></div></div>'''
          js='''<script id="wedding-invitation-opening-script">(function(){var o=document.getElementById("wedding-invitation-opening"),h=o&&o.querySelector(".wio-hit");if(!o||!h)return;document.documentElement.classList.add("wio-lock");h.addEventListener("click",function(){h.disabled=true;o.classList.add("wio-open");setTimeout(function(){o.classList.add("wio-done");document.documentElement.classList.remove("wio-lock");setTimeout(function(){o.remove()},800)},2050)},{once:true})})();</script>'''
          s=s.replace("</head>",css+"</head>",1)
          i=s.find(">",s.find("<body"))
          s=s[:i+1]+html+s[i+1:]
          s=s.replace("</body>",js+"</body>",1)
          p.write_text(s,encoding="utf-8")
          PY
      - name: Publicar y limpiar
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm -f .activar-sobre .github/workflows/aplicar-sobre.yml
          git add index.html
          git commit -m "Recupera sobre y apertura de invitación"
          git push
