name: Limpieza final
on:
  pull_request_target:
    types: [synchronize, reopened, opened]
    branches: [main]
permissions:
  contents: write
  pull-requests: write
jobs:
  clean:
    if: startsWith(github.head_ref, 'refinar-apertura-')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Eliminar workflow y rama auxiliar
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          HEAD_REF: ${{ github.head_ref }}
        run: |
          set -e
          rm -f .github/workflows/limpieza-final.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Limpia el último workflow auxiliar" || true
          git push origin main || true
          gh api --method DELETE "repos/${{ github.repository }}/git/refs/heads/${HEAD_REF}" || true
          gh pr close "${PR_NUMBER}" || true
