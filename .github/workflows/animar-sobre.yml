name: Animar apertura del sobre

on:
  push:
    paths:
      - '.github/workflows/animar-sobre.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Añadir apertura física y destello
        run: |
          set -e
          BASE="8be4f486d84d140ff0b55977434a3eadea319755"
          git show "$BASE:index.html" > index.html

          IMG=$(find . -maxdepth 1 -type f -iname 'invit*.png' -printf '%f\n' | head -n 1)
          test -n "$IMG"

          python3 - "$IMG" <<'PY'
          from pathlib import Path
          import sys
          p=Path("index.html")
          s=p.read_text(encoding="utf-8")
          img=sys.argv[1]

          css = """
          <style id="wedding-invitation-animation-style">
          #weddingInvitationOpen{
            position:fixed!important;inset:0!important;z-index:2147483647!important;
            display:block!important;background:#eee9df!important;overflow:hidden!important;
            opacity:1;visibility:visible;
            transition:opacity .9s ease,visibility .9s ease;
          }
          #weddingInvitationOpen.wio-finished{
            opacity:0!important;visibility:hidden!important;pointer-events:none!important;
          }
          #weddingInvitationOpen .wio-base,
          #weddingInvitationOpen .wio-flap{
            position:absolute!important;inset:0!important;width:100%!important;height:100%!important;
            display:block!important;margin:0!important;padding:0!important;
            object-fit:cover!important;object-position:center!important;
            border:0!important;border-radius:0!important;
          }
          #weddingInvitationOpen .wio-base{
            transform:scale(1);transition:transform 1.25s cubic-bezier(.18,.72,.2,1);
          }
          #weddingInvitationOpen .wio-flap{
            z-index:4;clip-path:polygon(0 0,100% 0,100% 63.5%,50% 78%,0 63.5%);
            transform-origin:50% 63.5%;
            backface-visibility:hidden;-webkit-backface-visibility:hidden;
            transition:transform .72s cubic-bezier(.35,.05,.25,1),filter .72s ease;
          }
          #weddingInvitationOpen .wio-seal{
            position:absolute!important;z-index:8;left:50%!important;top:52%!important;
            width:155px!important;height:155px!important;transform:translate(-50%,-50%)!important;
            margin:0!important;padding:0!important;border:0!important;border-radius:50%!important;
            background:transparent!important;opacity:0!important;cursor:pointer!important;
            appearance:none!important;-webkit-appearance:none!important;
          }
          #weddingInvitationOpen .wio-seal:focus,
          #weddingInvitationOpen .wio-seal:hover,
          #weddingInvitationOpen .wio-seal:active{
            outline:0!important;box-shadow:none!important;background:transparent!important;opacity:0!important;
          }
          #weddingInvitationOpen .wio-card{
            position:absolute!important;z-index:3;left:50%;top:48%;
            width:min(72vw,360px);height:min(42vh,270px);
            transform:translate(-50%,35%) scale(.96);
            background:linear-gradient(135deg,#fffdf8,#f3eee3);
            border:1px solid rgba(139,128,98,.25);
            box-shadow:0 20px 50px rgba(61,48,28,.22);
            opacity:0;border-radius:2px;
            transition:transform .8s cubic-bezier(.2,.8,.2,1),opacity .35s ease;
          }
          #weddingInvitationOpen .wio-card:before{
            content:"";position:absolute;inset:15px;border:1px solid rgba(139,128,98,.28);
          }
          #weddingInvitationOpen .wio-card:after{
            content:"ÁNGEL  &  ANTONIO";position:absolute;left:0;right:0;top:43%;
            text-align:center;color:#6d705d;letter-spacing:.25em;font:16px Georgia,"Times New Roman",serif;
          }
          #weddingInvitationOpen .wio-light{
            position:absolute;inset:-25%;z-index:20;pointer-events:none;
            opacity:0;background:radial-gradient(circle at 50% 53%,rgba(255,255,255,1) 0%,rgba(255,249,228,.92) 12%,rgba(255,255,255,.42) 35%,rgba(255,255,255,0) 67%);
            transform:scale(.35);
          }
          #weddingInvitationOpen.wio-opening .wio-flap{
            transform:perspective(1000px) rotateX(-74deg);
            filter:brightness(1.06);
          }
          #weddingInvitationOpen.wio-opening .wio-seal{
            animation:wioSealLift .55s ease-out forwards;
          }
          #weddingInvitationOpen.wio-opening .wio-card{
            opacity:1;transform:translate(-50%,-8%) scale(1);
            transition-delay:.16s;
          }
          #weddingInvitationOpen.wio-opening .wio-light{
            animation:wioLight .95s ease-out .55s forwards;
          }
          #weddingInvitationOpen.wio-opening .wio-base{
            transform:scale(1.055);
          }
          @keyframes wioSealLift{
            0%{opacity:0;transform:translate(-50%,-50%) scale(1)}
            20%{opacity:0;transform:translate(-50%,-50%) scale(1)}
            45%{opacity:0;transform:translate(-50%,-58%) scale(1.03)}
            100%{opacity:0;transform:translate(-50%,-72%) scale(.9)}
          }
          @keyframes wioLight{
            0%{opacity:0;transform:scale(.35)}
            45%{opacity:.95;transform:scale(.9)}
            100%{opacity:1;transform:scale(1.55)}
          }
          @media(max-width:600px){
            #weddingInvitationOpen .wio-seal{width:155px!important;height:155px!important;top:52%!important}
            #weddingInvitationOpen .wio-card{width:76vw;height:35vh;top:49%}
            #weddingInvitationOpen .wio-card:after{font-size:13px}
          }
          </style>
          """

          html = f"""
          <div id="weddingInvitationOpen" aria-label="Abrir invitación">
            <img class="wio-base" src="{img}" alt="Invitación de Ángel y Antonio">
            <img class="wio-flap" src="{img}" alt="" aria-hidden="true">
            <div class="wio-card" aria-hidden="true"></div>
            <div class="wio-light" aria-hidden="true"></div>
            <button class="wio-seal" id="weddingInvitationHit" type="button" aria-label="Abrir invitación"></button>
          </div>
          """

          js = """
          <script id="wedding-invitation-animation-script">
          (function(){
            var layer=document.getElementById('weddingInvitationOpen');
            var hit=document.getElementById('weddingInvitationHit');
            if(!layer||!hit)return;
            var done=false;
            function openIt(){
              if(done)return;
              done=true;
              hit.blur();
              layer.classList.add('wio-opening');
              setTimeout(function(){
                layer.classList.add('wio-finished');
                setTimeout(function(){layer.remove();},950);
              },1450);
            }
            hit.addEventListener('click',openIt);
          })();
          </script>
          """

          s=s.replace("</body>",css+html+js+"\n</body>",1)
          p.write_text(s,encoding="utf-8")
          PY

          rm -f .github/workflows/animar-sobre.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git add -A
          git commit -m "Añade apertura del sobre y destello" || exit 0
          git push
