name: Recuperar sobre

on:
  push:
    branches: [main]
    paths:
      - '.recuperar-sobre-run'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Añadir pantalla del sobre
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path("index.html")
          s=p.read_text(encoding="utf-8")

          if 'id="wedding-envelope-screen"' in s:
              print("La pantalla del sobre ya existe.")
          else:
              css=r'''
<style id="wedding-envelope-screen-css">
html.envelope-lock,html.envelope-lock body{overflow:hidden!important}
#wedding-envelope-screen{position:fixed;inset:0;z-index:2147483647;background:#efe7d7;display:flex;align-items:center;justify-content:center;opacity:1;visibility:visible;transition:opacity .7s ease,visibility .7s ease}
#wedding-envelope-screen.is-opening{opacity:0;visibility:hidden;pointer-events:none}
#wedding-envelope-screen .envelope-image{width:100%;height:100%;object-fit:cover;object-position:center;display:block}
#wedding-envelope-screen .envelope-hit{position:absolute;left:50%;top:50%;width:min(32vw,150px);height:min(32vw,150px);transform:translate(-50%,-50%);border:0;background:transparent;border-radius:50%;cursor:pointer;-webkit-tap-highlight-color:transparent}
#wedding-envelope-screen .envelope-hit:focus{outline:none}
#wedding-envelope-screen .envelope-glow{position:absolute;inset:-15%;pointer-events:none;opacity:0;background:radial-gradient(circle at 50% 52%,rgba(255,249,220,0) 0 18%,rgba(255,247,213,.9) 48%,rgba(255,255,255,1) 78%,#fff 100%)}
#wedding-envelope-screen.is-open .envelope-glow{animation:envelopeGlow .9s ease .65s forwards}
@keyframes envelopeGlow{0%{opacity:0;transform:scale(.65)}40%{opacity:1;transform:scale(.95)}100%{opacity:0;transform:scale(1.15)}}
</style>
'''
              html=r'''
<div id="wedding-envelope-screen" aria-label="Invitación de boda">
  <img class="envelope-image" src="invitaci%C3%B3n.PNG" alt="Invitación de Ángel y Antonio">
  <button class="envelope-hit" type="button" aria-label="Abrir invitación"></button>
  <div class="envelope-glow"></div>
</div>
'''
              js=r'''
<script id="wedding-envelope-screen-js">
(function(){
  var screen=document.getElementById('wedding-envelope-screen');
  var hit=screen&&screen.querySelector('.envelope-hit');
  if(!screen||!hit)return;
  document.documentElement.classList.add('envelope-lock');
  hit.addEventListener('click',function(){
    hit.disabled=true;
    screen.classList.add('is-open');
    setTimeout(function(){
      screen.classList.add('is-opening');
      document.documentElement.classList.remove('envelope-lock');
      setTimeout(function(){screen.remove()},750);
    },1550);
  },{once:true});
})();
</script>
'''
              if '</head>' not in s: raise SystemExit("No head")
              if '<body' not in s: raise SystemExit("No body")
              s=s.replace('</head>',css+'</head>',1)
              b=s.find('<body')
              e=s.find('>',b)
              s=s[:e+1]+html+s[e+1:]
              s=s.replace('</body>',js+'</body>',1)
              p.write_text(s,encoding='utf-8')
          PY

      - name: Publicar y limpiar
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Recupera pantalla inicial de invitación" || true
          rm -f .recuperar-sobre-run .github/workflows/recuperar-sobre.yml
          git add -A
          git commit -m "Limpia archivos auxiliares" || true
          git push
