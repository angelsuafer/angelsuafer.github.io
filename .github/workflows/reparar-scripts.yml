name: Reparar scripts de apertura
on:
  pull_request_target:
    types: [opened, reopened, synchronize]
    branches: [main]
permissions:
  contents: write
  pull-requests: write
jobs:
  fix:
    if: startsWith(github.head_ref, 'reparar-scripts-')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Restaurar juego y script de apertura
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
          HEAD_REF: ${{ github.head_ref }}
        run: |
          set -e
          python3 <<'PY'
          from pathlib import Path
          import re
          p=Path("index.html")
          s=p.read_text(encoding="utf-8")
          s=re.sub(r'<script>\s*\(function\(\)\{\s*var layer=document\.getElementById\([\x27"]weddingInvitationOpen[\x27"]\)[\s\S]*?</script>\s*','',s)
          game='''<script>
          (function(){
            var openBtn=document.getElementById('kahootButton');
            var modal=document.getElementById('gameModal');
            var closeBtn=document.getElementById('gameModalClose');
            var frame=document.getElementById('gameFrame');
            if(!openBtn||!modal||!closeBtn||!frame)return;
            function openGame(){
              frame.src='juego.html';
              modal.classList.add('open');
              modal.setAttribute('aria-hidden','false');
              document.body.classList.add('game-open');
            }
            function closeGame(){
              modal.classList.remove('open');
              modal.setAttribute('aria-hidden','true');
              document.body.classList.remove('game-open');
              frame.src='about:blank';
            }
            openBtn.addEventListener('click',openGame);
            closeBtn.addEventListener('click',closeGame);
            modal.addEventListener('click',function(e){if(e.target===modal)closeGame();});
            document.addEventListener('keydown',function(e){if(e.key==='Escape'&&modal.classList.contains('open'))closeGame();});
            window.closeWeddingGame=closeGame;
          })();
          </script>'''
          s=re.sub(r'<script>[\s\S]*?window\.closeWeddingGame[\s\S]*?</script>\s*','',s)
          openjs='''<script>
          (function(){
            var layer=document.getElementById('weddingInvitationOpen');
            var hit=document.getElementById('weddingInvitationHit');
            if(!layer||!hit)return;
            var done=false;
            function openIt(){
              if(done)return;
              done=true;
              hit.blur();
              layer.classList.add('wio-opening');
              setTimeout(function(){
                layer.classList.add('wio-finished');
                setTimeout(function(){layer.remove();},760);
              },2050);
            }
            hit.addEventListener('click',openIt);
          })();
          </script>'''
          s=s.replace('</body>',game+openjs+'</body>')
          p.write_text(s,encoding='utf-8')
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Restaura scripts del juego y apertura" || true
          git push origin main
          gh api --method DELETE "repos/${{ github.repository }}/git/refs/heads/${HEAD_REF}" || true
          rm -f .github/workflows/reparar-scripts.yml
          git add -A
          git commit -m "Limpia el workflow de reparación" || true
          git push origin main
          gh pr close "${PR_NUMBER}" || true
