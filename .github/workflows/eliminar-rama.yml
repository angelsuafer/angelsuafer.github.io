name: Eliminar rama temporal
on:
  pull_request_target:
    types: [synchronize, reopened, opened]
    branches: [main]
permissions:
  contents: write
  pull-requests: write
jobs:
  clean:
    if: startsWith(github.head_ref, 'reparar-scripts-')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Borrar workflow y rama
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_REF: ${{ github.head_ref }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -e
          rm -f .github/workflows/eliminar-rama.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Limpia el último archivo auxiliar" || true
          git push origin main
          git push origin --delete "$HEAD_REF" || true
          gh pr close "$PR_NUMBER" || true
