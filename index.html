<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Ángel & Antonio · 17 · 04 · 2027</title><style>
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#efe7d7}
#site{position:fixed;inset:0;width:100%;height:100%;border:0;display:block}
#intro{position:fixed;inset:0;z-index:9999;background:#efe7d7;transition:opacity 1.9s ease,visibility 1.9s ease;overflow:hidden}
#intro.done{opacity:0;visibility:hidden;pointer-events:none}
#invitation{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:center;display:block}
#sealHit{position:absolute;left:50%;top:49%;width:min(30vw,150px);aspect-ratio:1;transform:translate(-50%,-50%);border:0;background:transparent;border-radius:50%;cursor:pointer;-webkit-tap-highlight-color:transparent}
#sealHit:focus{outline:none}
#glow{position:absolute;inset:-15%;pointer-events:none;opacity:0;background:
radial-gradient(circle at 50% 49%,
rgba(255,255,255,0) 0 12%,
rgba(255,255,255,.72) 28%,
rgba(255,255,255,.9) 43%,
rgba(255,255,255,.72) 58%,
rgba(255,255,255,0) 76%);
transform:scale(.62);filter:brightness(1.15)}
#glow:after{content:"";position:absolute;inset:0;background:
radial-gradient(circle at 50% 49%,
rgba(255,255,255,.88) 0 12%,
rgba(255,255,255,.55) 25%,
rgba(255,255,255,0) 58%);
opacity:0}
.open #glow{animation:glow 2.05s cubic-bezier(.2,.72,.2,1) .08s forwards}
.open #glow:after{animation:flash 2.05s ease .2s forwards}
.open #invitation{animation:zoom 2.05s ease forwards}
@keyframes glow{
0%{opacity:0;transform:scale(.62);filter:brightness(1)}
18%{opacity:.55;transform:scale(.72);filter:brightness(1.08)}
36%{opacity:.78;transform:scale(.86);filter:brightness(1.18)}
52%{opacity:.92;transform:scale(1.02);filter:brightness(1.3)}
66%{opacity:.7;transform:scale(1.18);filter:brightness(1.18)}
82%{opacity:.38;transform:scale(1.36);filter:brightness(1.08)}
100%{opacity:0;transform:scale(1.58);filter:brightness(1)}
}
@keyframes flash{
0%{opacity:0;transform:scale(.72)}
25%{opacity:.35;transform:scale(.82)}
43%{opacity:.68;transform:scale(1)}
56%{opacity:.78;transform:scale(1.1)}
70%{opacity:.45;transform:scale(1.28)}
100%{opacity:0;transform:scale(1.55)}
}
@keyframes zoom{0%{transform:scale(1)}100%{transform:scale(1.035)}}
</style></head><body>
<iframe id="site" src="boda.html" title="Web de boda"></iframe>
<div id="intro" aria-label="Invitación de boda">
<img id="invitation" src="invitacio%CC%81n.PNG" alt="Invitación de Ángel y Antonio">
<button id="sealHit" type="button" aria-label="Abrir invitación"></button>
<div id="glow"></div>
</div>
<script>
(function(){
  var site=document.getElementById('site');

  function connectCountdown(doc){
    try{
      var countdown=doc.getElementById('weddingCountdown');
      if(!countdown||doc.getElementById('cdMonths'))return;
      var days=doc.getElementById('cdDays');
      if(!days)return;
      var months=doc.createElement('div');
      months.className='count-unit';
      months.innerHTML='<span id="cdMonths">0</span><small>MESES</small>';
      countdown.insertBefore(months,days.parentNode);
      days.parentNode.querySelector('small').textContent='DÍAS';

      var style=doc.createElement('style');
      style.id='monthCountdownStyle';
      style.textContent='.countdown{display:flex;justify-content:center;gap:0}.countdown .count-unit{min-width:63px}.countdown .count-unit span{display:flex;flex-direction:column;line-height:1}.countdown .count-unit small{display:block}.countdown .count-unit:first-child{border-left:0}@media(max-width:700px){.countdown .count-unit{min-width:52px}}';
      doc.head.appendChild(style);

      var target=new Date('2027-04-17T17:30:00+02:00');
      var mEl=doc.getElementById('cdMonths');
      var hEl=doc.getElementById('cdHours');
      var minEl=doc.getElementById('cdMinutes');
      var sEl=doc.getElementById('cdSeconds');
      var timer;
      var nativeTextContent=Object.getOwnPropertyDescriptor(Node.prototype,'textContent');
      var updating=false;
      [mEl,days,hEl,minEl,sEl].forEach(function(el){
        if(!el||!nativeTextContent)return;
        Object.defineProperty(el,'textContent',{
          configurable:true,
          get:function(){return nativeTextContent.get.call(el);},
          set:function(value){if(updating)nativeTextContent.set.call(el,value);}
        });
      });
      function setValue(el,value){
        if(!el)return;
        updating=true; el.textContent=value; updating=false;
      }
      function addMonth(date){
        var next=new Date(date.getTime()),day=next.getDate();
        next.setDate(1); next.setMonth(next.getMonth()+1);
        var last=new Date(next.getFullYear(),next.getMonth()+1,0).getDate();
        next.setDate(Math.min(day,last)); return next;
      }
      function tick(){
        var now=new Date(),remaining=Math.max(0,target.getTime()-now.getTime());
        var cursor=new Date(now.getTime()),count=0;
        while(remaining>0){
          var next=addMonth(cursor);
          if(next.getTime()>target.getTime())break;
          cursor=next; count++;
        }
        var total=Math.floor(Math.max(0,target.getTime()-cursor.getTime())/1000);
        var d=Math.floor(total/86400),h=Math.floor((total%86400)/3600),min=Math.floor((total%3600)/60),sec=total%60;
        setValue(mEl,String(count));setValue(days,String(d));setValue(hEl,String(h).padStart(2,'0'));setValue(minEl,String(min).padStart(2,'0'));setValue(sEl,String(sec).padStart(2,'0'));
        if(remaining<=0)window.clearInterval(timer);
      }
      tick(); timer=window.setInterval(tick,1000);
    }catch(e){console.error('No se pudo actualizar la cuenta atrás:',e);}
  }

  function connectRSVP(){
    try{
      var win=site.contentWindow,doc=site.contentDocument;
      if(!win||!doc)return;
      connectCountdown(doc);
      var music=doc.querySelector('audio'); if(music)music.loop=true;

      var attendance=doc.getElementById('attendance'),form=doc.querySelector('#rsvp form');
      var hotelField=doc.getElementById('hotel');
      if(hotelField&&!doc.getElementById('hotelSelect')){
        var hotelLabel=hotelField.previousElementSibling;
        if(hotelLabel&&hotelLabel.tagName==='LABEL')hotelLabel.textContent='Si duermes por la zona de Loja, ¿en qué alojamiento?';
        var hotelSelect=doc.createElement('select');
        hotelSelect.id='hotelSelect';hotelSelect.name='hotel';
        hotelSelect.innerHTML='<option value="" selected>Selecciona una opción</option><option value="Abades Loja">Abades Loja</option><option value="Abades Manzanil">Abades Manzanil</option><option value="Otro">Otro</option>';
        hotelField.replaceWith(hotelSelect);
        var otherHotelWrap=doc.createElement('div');
        otherHotelWrap.id='otherHotelWrap';otherHotelWrap.className='conditional';otherHotelWrap.hidden=true;
        otherHotelWrap.innerHTML='<label for="other_hotel">¿Cuál?</label><input id="other_hotel" name="other_hotel" type="text" placeholder="">';
        hotelSelect.insertAdjacentElement('afterend',otherHotelWrap);
        var hotelStyle=doc.createElement('style');
        hotelStyle.textContent='#otherHotelWrap{margin-top:2px}.box #hotelSelect,.box #otherHotelWrap input{box-sizing:border-box;width:100%}';
        doc.head.appendChild(hotelStyle);
        function syncHotel(){
          var show=hotelSelect.value==='Otro';otherHotelWrap.hidden=!show;
          if(!show)doc.getElementById('other_hotel').value='';
        }
        hotelSelect.addEventListener('change',syncHotel);syncHotel();
      }

      if(form&&attendance&&!doc.getElementById('attendanceNoteWrap')){
        var noteWrap=doc.createElement('div');
        noteWrap.id='attendanceNoteWrap';noteWrap.className='conditional';noteWrap.hidden=true;
        noteWrap.innerHTML='<label for="attendance_note">¿Quieres compartir algo con nosotros?</label><p class="rsvp-note-help">Si quieres, puedes dejarnos voluntariamente una pequeña nota.</p><textarea id="attendance_note" name="attendance_note" placeholder="Tu nota (opcional)"></textarea>';
        var allergies=doc.getElementById('allergies'),allergiesLabel=doc.querySelector('label[for="allergies"]');
        if(allergiesLabel)allergiesLabel.parentNode.insertBefore(noteWrap,allergiesLabel);

        var style=doc.createElement('style');
        style.textContent='.rsvp-note-help{margin:-7px 0 8px;color:#8b8376;font:14px/1.35 "EB Garamond",Georgia,serif;font-style:italic}.rsvp-change-note{margin:18px auto 0;max-width:560px;text-align:center;color:#81786a;font:14px/1.45 "EB Garamond",Georgia,serif}.rsvp-change-note strong{font-weight:500;color:#756956}.companion-help{font-weight:400;font-size:.92em}.botanical-bottom{display:none!important}#companion_names{min-height:96px;resize:vertical;box-sizing:border-box;width:100%;line-height:1.45}';
        doc.head.appendChild(style);

        function syncNote(){
          var show=attendance.value==='No puedo ir'||attendance.value==='Pendiente';
          noteWrap.hidden=!show;if(!show)doc.getElementById('attendance_note').value='';
        }
        attendance.addEventListener('change',syncNote);syncNote();

        var companions=doc.getElementById('companions'),companionLabel=doc.querySelector('label[for="companions"]'),companionNames=doc.getElementById('companionNames');
        var companionNamesLabel=doc.querySelector('label[for="companion_names"]');
        if(companionNamesLabel)companionNamesLabel.innerHTML='¿Con quién vienes?<br><span class="companion-help">Escribe el nombre y apellidos de tu acompañante o acompañantes</span>';

        var companionInput=doc.getElementById('companion_names');
        if(companionInput&&companionInput.tagName==='INPUT'){
          var companionTextarea=doc.createElement('textarea');
          companionTextarea.id='companion_names';companionTextarea.name='companion_names';
          companionTextarea.placeholder='Nombre y apellidos';
          companionTextarea.rows=3;
          companionTextarea.wrap='soft';
          companionTextarea.autocomplete='off';
          companionInput.replaceWith(companionTextarea);
        }

        /* Evita el cuadro emergente original de boda.html al elegir Acompañado/a.
           Se sustituye el select por una copia sin sus listeners anteriores y se
           controla directamente desde aquí la aparición del campo multilínea. */
        if(companions){
          var cleanCompanions=companions.cloneNode(true);
          cleanCompanions.removeAttribute('onchange');
          cleanCompanions.removeAttribute('onclick');
          cleanCompanions.removeAttribute('oninput');
          companions.replaceWith(cleanCompanions);
          companions=cleanCompanions;

          function syncCompanions(){
            var accompanied=companions.value==='Acompañado/a';
            if(companionNames){
              companionNames.hidden=!accompanied;
              companionNames.style.display=accompanied?'':'none';
            }
            if(!accompanied){
              var ci=doc.getElementById('companion_names');
              if(ci)ci.value='';
            }
          }
          companions.addEventListener('change',syncCompanions);
          syncCompanions();
        }

        var attendanceLabel=doc.querySelector('label[for="attendance"]'),allergiesLabel2=doc.querySelector('label[for="allergies"]');
        if(allergiesLabel2)allergiesLabel2.textContent='Alergias e intolerancias';
        var hotelLabel=doc.querySelector('label[for="hotelSelect"]')||doc.querySelector('label[for="hotel"]');
        var transport=doc.getElementById('transport'),transportLabel=doc.querySelector('label[for="transport"]');
        var otherTransportWrap=doc.getElementById('otherTransportWrap');
        if(transport && !Array.from(transport.options).some(function(o){return o.value==='Otro';})){
          var otherTransportOption=doc.createElement('option');
          otherTransportOption.value='Otro';
          otherTransportOption.textContent='Otro';
          transport.appendChild(otherTransportOption);
        }
        if(transport && !otherTransportWrap){
          otherTransportWrap=doc.createElement('div');
          otherTransportWrap.id='otherTransportWrap';
          otherTransportWrap.className='conditional';
          otherTransportWrap.hidden=true;
          otherTransportWrap.innerHTML='<label for="other_transport">¿Cuál?</label><input id="other_transport" name="other_transport" type="text" placeholder="">';
          transport.insertAdjacentElement('afterend',otherTransportWrap);
          var otherTransportStyle=doc.createElement('style');
          otherTransportStyle.textContent='#otherTransportWrap{margin-top:2px}.box #otherTransportWrap input{box-sizing:border-box;width:100%}';
          doc.head.appendChild(otherTransportStyle);
        }
        function syncOtherTransport(){
          if(!transport||!otherTransportWrap)return;
          var show=transport.value==='Otro';
          otherTransportWrap.hidden=!show;
          if(!show)doc.getElementById('other_transport').value='';
        }
        if(transport){
          transport.addEventListener('change',syncOtherTransport);
          syncOtherTransport();
          transport.removeAttribute('required');
        }
        var songsLabel=doc.querySelector('label:not([for])'),songs=doc.querySelector('.songs');
        var nameField=doc.getElementById('name'),nameLabel=doc.querySelector('label[for="name"]'),button=form.querySelector('button[type="submit"]');

        function moveNode(node){if(node)form.appendChild(node);}
        moveNode(nameLabel);moveNode(nameField);
        moveNode(attendanceLabel);moveNode(attendance);moveNode(noteWrap);
        moveNode(companionLabel);moveNode(companions);moveNode(companionNames);
        moveNode(allergiesLabel2);moveNode(allergies);
        moveNode(hotelLabel);moveNode(doc.getElementById('hotelSelect')||doc.getElementById('hotel'));moveNode(doc.getElementById('otherHotelWrap'));
        moveNode(transportLabel);moveNode(transport);
        if(songsLabel&&songsLabel.textContent.indexOf('Las 3 canciones')!==-1)moveNode(songsLabel);
        moveNode(songs);moveNode(button);

        var postAttendanceNodes=[companionLabel,companions,companionNames,allergiesLabel2,allergies,hotelLabel,doc.getElementById('hotelSelect')||doc.getElementById('hotel'),doc.getElementById('otherHotelWrap'),transportLabel,transport,songsLabel,songs];
        function setUnavailable(disabled){
          postAttendanceNodes.forEach(function(node){
            if(!node)return;
            node.style.opacity=disabled?'0.45':'';
            var controls=node.matches&&node.matches('input,select,textarea')?[node]:node.querySelectorAll?node.querySelectorAll('input,select,textarea'):[];
            Array.from(controls).forEach(function(control){control.disabled=disabled;});
          });
        }
        function syncAttendance(){
          var no=attendance.value==='No puedo ir';setUnavailable(no);
          if(no){
            companions.value='';
            if(companionNames){companionNames.hidden=true;var ci=companionNames.querySelector('input,textarea');if(ci)ci.value='';}
            if(doc.getElementById('allergies'))doc.getElementById('allergies').value='';
            if(doc.getElementById('hotelSelect'))doc.getElementById('hotelSelect').value='';
            if(doc.getElementById('otherHotelWrap'))doc.getElementById('otherHotelWrap').hidden=true;
            if(doc.getElementById('other_hotel'))doc.getElementById('other_hotel').value='';
            if(transport){transport.value='';syncOtherTransport();}
            if(doc.getElementById('other_transport'))doc.getElementById('other_transport').value='';
            ['song1','song2','song3'].forEach(function(id){var song=doc.getElementById(id);if(song)song.value='';});
          }
          syncNote();
        }
        attendance.addEventListener('change',syncAttendance);syncAttendance();

        var change=doc.createElement('p');
        change.className='rsvp-change-note';
        change.innerHTML='¿Ha cambiado algo desde que enviaste tu respuesta?<br>No pasa nada. Puedes volver a rellenar el formulario o escribirnos por WhatsApp <strong>hasta el lunes 5 de abril de 2027</strong>.';
        form.appendChild(change);
      }else if(doc.head&&!doc.getElementById('timelineDecorationFix')){
        var style2=doc.createElement('style');style2.id='timelineDecorationFix';style2.textContent='.botanical-bottom{display:none!important}';doc.head.appendChild(style2);
      }

      win.sendRSVP=async function(event){
        if(event)event.preventDefault();
        var form=event&&event.target?event.target:doc.querySelector('#rsvp form');if(!form)return false;
        var button=form.querySelector('button[type="submit"]');
        if(button){button.disabled=true;button.textContent='ENVIANDO…';}
        var data={
          name:(doc.getElementById('name')||{}).value||'',
          attendance:(doc.getElementById('attendance')||{}).value||'',
          note:(doc.getElementById('attendance_note')||{}).value||'',
          companions:(doc.getElementById('companions')||{}).value==='Acompañado/a'?((doc.getElementById('companion_names')||{}).value||''):((doc.getElementById('companions')||{}).value||''),
          allergies:(doc.getElementById('allergies')||{}).value||'',
          hotel:(doc.getElementById('hotelSelect')||{}).value==='Otro'?((doc.getElementById('other_hotel')||{}).value||'Otro'):((doc.getElementById('hotelSelect')||{}).value||''),
          arrival:(doc.getElementById('transport')||{}).value==='Otro'?((doc.getElementById('other_transport')||{}).value||'Otro'):((doc.getElementById('transport')||{}).value||''),
          song_1:(doc.getElementById('song1')||{}).value||'',
          song_2:(doc.getElementById('song2')||{}).value||'',
          song_3:(doc.getElementById('song3')||{}).value||''
        };
        try{
          var response=await fetch('https://dfwfytgiehdfrewgbdic.supabase.co/functions/v1/rsvp',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(data)});
          var result=await response.json().catch(function(){return {};});
          if(!response.ok||!result.ok)throw new Error(result.error||'RSVP error');
          if(button){button.textContent='✓ RSVP ENVIADO';button.disabled=true;}
          var msg=doc.createElement('p');msg.textContent='¡Gracias! Hemos recibido vuestra respuesta. ❤️';msg.style.cssText="text-align:center;margin:16px 0 0;color:#66705a;font:18px 'EB Garamond',serif;";form.appendChild(msg);
        }catch(error){
          console.error(error);
          if(button){button.disabled=false;button.textContent='ENVIAR RSVP';}
          alert('No hemos podido enviar el RSVP. Por favor, inténtalo de nuevo.');
        }
        return false;
      };
    }catch(error){console.error('No se pudo conectar el RSVP:',error);}
  }

  site.addEventListener('load',connectRSVP);
  if(site.contentDocument&&site.contentDocument.readyState==='complete')connectRSVP();

  var intro=document.getElementById('intro'),hit=document.getElementById('sealHit');
  hit.addEventListener('click',function(){
    hit.disabled=true;intro.classList.add('open');
    setTimeout(function(){intro.classList.add('done')},1050);
  },{once:true});
})();
</script>
</body></html>
