<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Ángel & Antonio · 17 · 04 · 2027</title>
<style>
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#efe7d7}
#site{position:fixed;inset:0;width:100%;height:100%;border:0;display:block}
#intro{position:fixed;inset:0;z-index:10;background:#efe7d7;overflow:hidden;transition:opacity .8s ease,visibility .8s ease}
#intro.done{opacity:0;visibility:hidden;pointer-events:none}
#base,#flap{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:center;display:block}
#flap{clip-path:polygon(0 0,100% 0,50% 53%,0 53%);transform-origin:50% 53%;transform-style:preserve-3d;transition:transform 1.15s cubic-bezier(.2,.78,.18,1)}
.open #flap{transform:rotateX(-170deg)}
#seal{position:absolute;left:50%;top:51%;width:min(24vw,110px);aspect-ratio:1;transform:translate(-50%,-50%);border-radius:50%;overflow:hidden;box-shadow:0 5px 22px rgba(62,42,19,.28);pointer-events:none}
#seal img{width:100%;height:100%;object-fit:cover;object-position:50% 51%}
#hit{position:absolute;left:50%;top:51%;width:min(32vw,150px);aspect-ratio:1;transform:translate(-50%,-50%);border:0;background:transparent;border-radius:50%;cursor:pointer;-webkit-tap-highlight-color:transparent}
#hit:focus{outline:none}
#light{position:absolute;inset:-15%;opacity:0;pointer-events:none;background:radial-gradient(circle at 50% 52%,rgba(255,249,220,0) 0 18%,rgba(255,247,213,.9) 48%,rgba(255,255,255,1) 78%,#fff 100%)}
.open #light{animation:flash .9s ease 1.05s forwards}
@keyframes flash{0%{opacity:0;transform:scale(.65)}40%{opacity:1;transform:scale(.95)}100%{opacity:0;transform:scale(1.15)}}
</style>
</head>
<body>
<iframe id="site" src="boda.html" title="Web de boda"></iframe>
<div id="intro">
<img id="base" src="invitacio%CC%81n.PNG" alt="Invitación de Ángel y Antonio">
<img id="flap" src="invitacio%CC%81n.PNG" alt="">
<span id="seal"><img src="invitacio%CC%81n.PNG" alt=""></span>
<button id="hit" type="button" aria-label="Abrir invitación"></button>
<div id="light"></div>
</div>
<script>
(function(){
 var intro=document.getElementById('intro'),hit=document.getElementById('hit');
 hit.addEventListener('click',function(){
   hit.disabled=true;
   intro.classList.add('open');
   setTimeout(function(){intro.classList.add('done');},2050);
 },{once:true});
})();
</script>
</body>
</html>
