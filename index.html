<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Ángel & Antonio · 17 · 04 · 2027</title><style>
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#efe7d7}
#site{position:fixed;inset:0;width:100%;height:100%;border:0;display:block}
#intro{position:fixed;inset:0;z-index:9999;background:#efe7d7;transition:opacity 1s ease,visibility 1s ease;overflow:hidden}
#intro.done{opacity:0;visibility:hidden;pointer-events:none}
#invitation{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:center;display:block}
#sealHit{position:absolute;left:50%;top:49%;width:min(30vw,150px);aspect-ratio:1;transform:translate(-50%,-50%);border:0;background:transparent;border-radius:50%;cursor:pointer;-webkit-tap-highlight-color:transparent}
#sealHit:focus{outline:none}
#glow{position:absolute;inset:-15%;pointer-events:none;opacity:0;background:radial-gradient(circle at 50% 49%,rgba(255,251,230,0) 0 12%,rgba(255,247,215,.72) 34%,rgba(255,255,255,.98) 72%,#fff 100%);transform:scale(.72)}
.open #glow{animation:glow .95s ease .12s forwards}
.open #invitation{animation:zoom .95s ease forwards}
@keyframes glow{0%{opacity:0;transform:scale(.72)}35%{opacity:1;transform:scale(.9)}100%{opacity:0;transform:scale(1.08)}}
@keyframes zoom{0%{transform:scale(1)}100%{transform:scale(1.025)}}
</style></head><body>
<iframe id="site" src="boda.html" title="Web de boda"></iframe>
<div id="intro" aria-label="Invitación de boda">
<img id="invitation" src="invitacio%CC%81n.PNG" alt="Invitación de Ángel y Antonio">
<button id="sealHit" type="button" aria-label="Abrir invitación"></button>
<div id="glow"></div>
</div>
<script>(function(){var intro=document.getElementById('intro'),hit=document.getElementById('sealHit');hit.addEventListener('click',function(){hit.disabled=true;intro.classList.add('open');setTimeout(function(){intro.classList.add('done')},1050)},{once:true})})();</script>
</body></html>
